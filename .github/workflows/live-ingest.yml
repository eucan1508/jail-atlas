name: Approved live ingest

on:
  schedule:
    # Iowa runs at midnight UTC; Minnesota six hours later; Texas at noon UTC.
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      state:
        description: "State to refresh"
        required: true
        default: IA
        type: choice
        options:
          - IA
          - MN
          - TX
      mode:
        description: "Use dry-run until the source approvals are complete"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - write

permissions:
  contents: read

concurrency:
  group: approved-live-ingest-state
  cancel-in-progress: false

jobs:
  gate:
    name: Check live ingest switch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        name: Read operator switch
        env:
          LIVE_INGEST_ENABLED: ${{ secrets.LIVE_INGEST_ENABLED }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "dry-run" ]] || [[ "$LIVE_INGEST_ENABLED" == "true" ]]; then
            # Do not emit the secret value itself as a job output. GitHub masks outputs that
            # equal a secret, which would make the dependent ingest job skip unexpectedly.
            echo "enabled=go" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=stop" >> "$GITHUB_OUTPUT"
          fi

  iowa:
    needs: gate
    name: Refresh approved state sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The explicit repository secret is the final operator-controlled enable switch. Keeping it
    # absent or false makes this scheduled workflow a no-op until the customer approves live writes.
    if: ${{ needs.gate.outputs.enabled == 'go' }}
    permissions:
      contents: read
      # Failed counties are recorded in the "Ingest health log" issue.
      issues: write
    env:
      CI: "true"
      NODE_ENV: production
      INGEST_MODE: live
      INGEST_NETWORK_ACCESS: enabled
      INGEST_DATABASE_WRITES: ${{ inputs.mode == 'dry-run' && 'disabled' || 'enabled' }}
      ALLOW_LIVE_SOURCE_FETCHES: "true"
      SOURCE_HOST_ALLOWLIST: inmates.dallascountyiowa.gov,cedarcounty.iowa.gov,www.bhcso.org,opendata.ramseycountymn.gov,jailroster.stearnscountymn.gov,incustodysearch.co.anoka.mn.us,mower-sftp.co.mower.mn.us,www.wrightcountymn.gov,www.milamcountysherifftx.org,www.hutchinsonsherifftx.org,www.kendallcountysheriff.com
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INGEST_STATE:
        ${{ inputs.state || (github.event.schedule == '0 12 * * *' && 'TX' || github.event.schedule
        == '0 6 * * *' && 'MN' || 'IA') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch Mower County official roster
        if: ${{ env.INGEST_STATE == 'MN' }}
        run: |
          roster_file="$RUNNER_TEMP/mower-roster.pdf"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 --retry 2 \
            --output "$roster_file" \
            "https://mower-sftp.co.mower.mn.us/WSFTPSVR/mcounty/jail/JailRoster.rpt.pdf"
          test "$(head -c 4 "$roster_file")" = "%PDF"
          echo "MOWER_COUNTY_ROSTER_FILE=$roster_file" >> "$GITHUB_ENV"

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/**" --if-present build

      - name: Refresh selected state counties sequentially
        run: |
          set -o pipefail
          if [[ "${{ inputs.mode }}" == "dry-run" ]]; then
            pnpm --filter @jail-atlas/ingest-worker dev -- run --state="$INGEST_STATE" --dry-run 2>&1 | tee "$RUNNER_TEMP/ingest.log"
          else
            pnpm --filter @jail-atlas/ingest-worker dev -- run --state="$INGEST_STATE" 2>&1 | tee "$RUNNER_TEMP/ingest.log"
          fi

      - name: Record county results
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Dry runs only write the job summary; scheduled and write runs also log failures.
          RECORD_FAILURES: ${{ inputs.mode != 'dry-run' }}
        run: node .github/scripts/ingest-report.mjs "$RUNNER_TEMP/ingest.log"
