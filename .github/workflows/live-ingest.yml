name: Approved live ingest

on:
  schedule:
    # Every state refreshes twice a day in one batch, 12 hours apart, so the database is awake
    # for two short windows instead of all day (Neon's free plan limits monthly compute time).
    # One failed or delayed batch is still covered by the next one inside the 30-hour page
    # freshness window.
    - cron: "23 5,17 * * *"
  workflow_dispatch:
    inputs:
      state:
        description: "State to refresh (ALL runs every state)"
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - IA
          - MN
          - TX
          - AR
          - OK
          - MO
          - KS
          - AL
          - FL
      mode:
        description: "Use dry-run until the source approvals are complete"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - write

permissions:
  contents: read

concurrency:
  group: approved-live-ingest-state
  cancel-in-progress: false

jobs:
  gate:
    name: Check live ingest switch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        name: Read operator switch
        env:
          LIVE_INGEST_ENABLED: ${{ secrets.LIVE_INGEST_ENABLED }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "dry-run" ]] || [[ "$LIVE_INGEST_ENABLED" == "true" ]]; then
            # Do not emit the secret value itself as a job output. GitHub masks outputs that
            # equal a secret, which would make the dependent ingest job skip unexpectedly.
            echo "enabled=go" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=stop" >> "$GITHUB_OUTPUT"
          fi

  iowa:
    needs: gate
    name: Refresh approved state sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state:
          ${{ fromJSON((!inputs.state || inputs.state == 'ALL') &&
          '["IA","MN","TX","AR","OK","MO","KS","AL","FL"]' || format('["{0}"]', inputs.state)) }}
    # The explicit repository secret is the final operator-controlled enable switch. Keeping it
    # absent or false makes this scheduled workflow a no-op until the customer approves live writes.
    if: ${{ needs.gate.outputs.enabled == 'go' }}
    permissions:
      contents: read
      # Failed counties are recorded in the "Ingest health log" issue.
      issues: write
    env:
      CI: "true"
      NODE_ENV: production
      INGEST_MODE: live
      INGEST_NETWORK_ACCESS: enabled
      INGEST_DATABASE_WRITES: ${{ inputs.mode == 'dry-run' && 'disabled' || 'enabled' }}
      ALLOW_LIVE_SOURCE_FETCHES: "true"
      SOURCE_HOST_ALLOWLIST: inmates.dallascountyiowa.gov,cedarcounty.iowa.gov,www.bhcso.org,sofiles.cerrogordo.gov,ww1.johnsoncountyiowa.gov,polkinmates.polkcountyiowa.gov,injail.wcicc.com,marshall-so-ia.zuercherportal.com,wapello-so-ia.zuercherportal.com,www.idacountysheriff.us,opendata.ramseycountymn.gov,jailroster.stearnscountymn.gov,incustodysearch.co.anoka.mn.us,mower-sftp.co.mower.mn.us,www.wrightcountymn.gov,jailroster.co.carlton.mn.us,www.douglascountymn.gov,www.stlouiscountymn.gov,www.steelecountymn.gov,www3.crowwing.us,custody.renvillecountymn.gov,web1.co.ottertail.mn.us,inmatelocatorext.co.sherburne.mn.us,www2.kcmn.us,web1.washingtoncountymn.gov,dakotacountymn.gov,files.claycountymn.gov,www.winonaco.com,api.hennepincounty.gov,jailroster.hennepin.us,ftp.co.nobles.mn.us,api.correctionsrecordssearch.com,www.freeborncountymn.gov,cms5.revize.com,redwoodcounty-mn.gov,www.watonwancountymn.gov,map.co.clearwater.mn.us,s3.us-east-2.amazonaws.com,prophoenix.co.hubbard.mn.us,jail.kanabec.org,www.meekercountymn.gov,co.wilkin.mn.us,www.milamcountysherifftx.org,www.kendallcountysheriff.com,www.klebergcoso.org,www.burlesoncountysherifftx.org,www.tomgreencountysheriff.org,www.angelinacounty.net,www.robertsoncountysherifftx.org,upshur-so-tx.zuercherportal.com,jeffersoncountytx.gov,www.crawfordcountyso.org,www.camdencountymosheriff.org,www.polkcountymosheriff.org,www.bentoncountysheriffmo.org,www.stonecountymosheriff.com,www.lawrencecosheriff.com,www.lewiscosheriff.org,www.morgancountymoso.org,www.bourboncountysheriffks.org,www.coffeycountysheriff.org,www.atcosheriffks.org,www.lvsheriff.org,www.jeffersoncountykssheriff.com,www.woodsonsheriff.com,www.cherokeecountykssheriff.com,www.jasoks.org,www.brownso.org,nemahasoks.gov,www.franklinsheriff.org,www.chiltoncountyso.org,www.stclairsheriff.org,www.jacksoncountysheriffal.org,www.marshallso.org,www.marionsoal.com,www.dekalbcountysheriff.org,www.jeffcoso.org,www.loganso.com,www.greenesoar.gov,www.cleburnearso.gov,www.fcso.ar.gov,www.hotspringcountysoar.gov,www.baxtercountysheriff.com,www.stfranciscountysheriff.org,www.mississippicountysheriffar.org,www.randolphcountysheriff.org,www.hempsteadcountysheriff.org,www.izardcountysheriff.org,www.crosscountysheriff.org,www.carrollcountysheriffar.gov,www.poinsettsheriffar.gov,www.myr2m.com,www.wagonercountyso.org,lincolncountysheriffok.gov,www.pawneecountysook.gov,www.seminolecosheriff.com,www.cartercountysheriff.us,ccsheriff.net,scsok.org,www.muskogeeso.org,www.ottawacountysook.gov,www.lovecosheriff.com,www.greercountysheriff.org,www.majorcosheriff.com,www.jacksoncountyso.com,www.custercountysheriff.com,craigcountyso.com,www.noblecosook.gov,www.andrewcountysheriff.org,www.washingtoncosheriff.com,inmate.sebastiancountyar.gov,all.mobileso.com,p2c.galvestoncountytx.gov,public.pottercountysheriff.org,www.elmoreso.com,www.callawaysheriff.org,www.mayessheriff.org,www.cherokeecountyalsheriff.com,www.salinecountysheriff.com,www.labettecountykssheriff.org,nwscorrections.waltonso.org,nwwebcad.fcpsn.org,www.capecountysheriff.org,www.colbertsheriff.net,www.pcsoal.org,www.caldwellcosdmo.gov
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INGEST_STATE: ${{ matrix.state }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch Mower County official roster
        if: ${{ env.INGEST_STATE == 'MN' }}
        # A failed download must not stop the other Minnesota counties: without the file the worker
        # reads Mower directly, and a Mower failure is reported for that county alone.
        run: |
          roster_file="$RUNNER_TEMP/mower-roster.pdf"
          if curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 --retry 2 \
            --output "$roster_file" \
            "https://mower-sftp.co.mower.mn.us/WSFTPSVR/mcounty/jail/JailRoster.rpt.pdf" &&
            test "$(head -c 4 "$roster_file")" = "%PDF"; then
            echo "MOWER_COUNTY_ROSTER_FILE=$roster_file" >> "$GITHUB_ENV"
          else
            echo "::warning::Mower County roster download failed; the other counties still run."
          fi

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/**" --if-present build

      - name: Refresh selected state counties sequentially
        run: |
          set -o pipefail
          if [[ "${{ inputs.mode }}" == "dry-run" ]]; then
            pnpm --filter @jail-atlas/ingest-worker dev -- run --state="$INGEST_STATE" --dry-run 2>&1 | tee "$RUNNER_TEMP/ingest.log"
          else
            pnpm --filter @jail-atlas/ingest-worker dev -- run --state="$INGEST_STATE" 2>&1 | tee "$RUNNER_TEMP/ingest.log"
          fi

      - name: Record county results
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Dry runs only write the job summary; scheduled and write runs also log failures.
          RECORD_FAILURES: ${{ inputs.mode != 'dry-run' }}
        run: node .github/scripts/ingest-report.mjs "$RUNNER_TEMP/ingest.log"

  finish:
    # Runs once after every state in the batch: deletes superseded snapshots, purges the page
    # cache, and renders every listed page again while the database is still awake.
    needs: [gate, iowa]
    name: Prune, purge, and warm the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() && needs.gate.outputs.enabled == 'go' && inputs.mode != 'dry-run' }}
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Delete superseded roster snapshots
        # Each write run stores a new snapshot per county. Older ones are never shown and must not
        # be kept (privacy-and-retention.md), and letting them pile up filled the database on
        # 2026-11-16. Keeps the two newest successful snapshots per source.
        working-directory: packages/database
        run: node scripts/prune-snapshots.mjs --apply

      - name: Purge cached site pages
        # Pages are cached on the CDN for up to 20 minutes. After every batch (even a partly failed
        # one) the whole cache is purged so new snapshots and removals show at once.
        id: purge
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [[ -z "$REVALIDATE_SECRET" ]]; then
            echo "::warning::REVALIDATE_SECRET is not set; cached pages expire on their own within 20 minutes."
            exit 0
          fi
          curl --fail --silent --show-error --proto '=https' --max-time 30 --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" \
            https://jailatlas.com/api/revalidate/
          echo "purged=yes" >> "$GITHUB_OUTPUT"

      - name: Render every listed page again
        # Fills the cache while the database is awake, so crawlers do not wake it page by page.
        if: ${{ steps.purge.outputs.purged == 'yes' }}
        run: |
          urls=$(curl --fail --silent --show-error --max-time 60 https://jailatlas.com/sitemap.xml |
            grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')
          count=0
          for url in $urls; do
            curl --silent --output /dev/null --max-time 60 "$url" || true
            count=$((count + 1))
            sleep 0.3
          done
          echo "Rendered $count pages."
